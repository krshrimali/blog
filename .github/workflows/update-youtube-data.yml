name: Update YouTube videos

on:
  schedule:
    - cron: "17 6 * * *"  # once a day
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Install yt-dlp
        run: pip install --upgrade yt-dlp

      - name: Fetch latest videos and live streams
        run: python3 scripts/fetch_youtube_data.py

      - name: Commit and push if changed
        run: |
          if git diff --quiet -- data/youtube.json; then
            echo "No new videos, nothing to commit."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/youtube.json
          git commit -m "Update YouTube videos and live streams"
          git push
