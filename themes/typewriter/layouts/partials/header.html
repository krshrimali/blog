<div class="sidebar">
  <header><a href="{{ "/" | absURL }}">{{ site.Title }}</a></header>
  {{ with site.Params.description }}<p class="site-subtitle">{{ . }}</p>{{ end }}
  <nav class="menu">
    {{ range site.Menus.main }}
      <div class="menu-item{{ if $.IsMenuCurrent "main" . }} active{{ end }}"><a href="{{ .URL | absURL }}">{{ .Name }}</a></div>
    {{ end }}
    {{ range site.Menus.other }}
      <div class="menu-item{{ if $.IsMenuCurrent "other" . }} active{{ end }}"><a href="{{ .URL | absURL }}">{{ .Name }}</a></div>
    {{ end }}
  </nav>
  <button id="theme-toggle" class="theme-toggle" type="button" aria-label="Toggle light and dark theme">☾ DARK</button>
</div>
