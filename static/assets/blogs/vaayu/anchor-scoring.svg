<figure class="vy" style="margin:1.5em 0"><svg viewBox="0 0 760 380" width="100%" style="max-width:760px;height:auto;display:block;margin:0 auto" role="img" aria-label="A review comment anchored on &#x27;return Ok(());&#x27; has three candidate matches after an edit, scored 2, 1 and 4 by surrounding context; it moves to the one scoring 4" xmlns="http://www.w3.org/2000/svg"><style>
